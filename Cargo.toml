[workspace]
members = [
    "programs/*"
]
# The smoke client pulls in the RPC stack, which has nothing to do with
# building or testing the program. Keeping it out of the workspace keeps
# `anchor test` quick.
exclude = [
    "client"
]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.89.0"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
